  <rect id="logo-slot" x="58" y="62" width="124" height="48" rx="24" fill="var(--pouch-window, #FFF8E6)"/>
  <rect id="product-window" x="58" y="112" width="124" height="102" rx="51" fill="var(--pouch-window, #FFF8E6)"/>
  <rect id="label-band" x="30" y="226" width="180" height="34" rx="17" fill="var(--pouch-band, #F1B005)"/>
</svg>
